<!doctype html>
<html lang="en" data-zbk-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:ital,wght@0,200..800;1,200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,300..900;1,300..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap">
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#4b47c4" />
		<meta name="theme-color" content="#4b47c4" />
		<script>
			// Resolve the theme before first paint so the page never flashes light-on-dark.
			(function () {
				var root = document.documentElement;
				var key = 'canvas-watch-theme';
				var stored = null;
				try {
					stored = window.localStorage.getItem(key);
				} catch (error) {
					stored = null;
				}
				var prefersDark = false;
				try {
					prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} catch (error) {
					prefersDark = false;
				}
				var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
				root.dataset.zbkTheme = theme;
				root.dataset.themeSource = stored ? 'manual' : 'system';
			})();
		</script>
		<link rel="stylesheet" href="%sveltekit.assets%/zbk-canvas-watch.min.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/zbk-dark.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="canvas-app ink-app font-primary">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
